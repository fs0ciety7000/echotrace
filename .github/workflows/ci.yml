name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint & format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests (engine + mission solvers)
        run: pnpm test
      - name: Content validation
        run: pnpm content:check
      - name: Build
        run: pnpm build
      - name: Install Chromium (accessibility check)
        run: pnpm --filter @echotrace/web exec playwright install --with-deps chromium
      - name: Accessibility (axe, WCAG 2.1 AA)
        run: pnpm a11y

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t echotrace:ci .
      - name: Smoke test
        run: |
          docker run -d --rm -p 8080:8080 --name echotrace echotrace:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          docker stop echotrace
