# Acte III — Mission 07 « Fréquence »
# Corrélation d'indicateurs sur des exports partagés ; distinguer un vrai écho d'un faux positif ;
# décider comment alerter.
# Question : une correspondance suffit-elle à désigner une cible ?

id: frequence
title: Fréquence
act: acte-3
order: 1
from: Mara Okonkwo-Lind
summary: Nos indicateurs résonnent ailleurs. Trouver où, et prévenir à temps.
question: Une correspondance d'indicateurs suffit-elle à désigner une cible ?
concepts:
  - forensique.correlation
  - forensique.ioc
  - ethique.divulgation
  - reconnaissance.osint

briefing: |
  Le CERT sectoriel de l'énergie a accepté notre demande : il nous transmet,
  sous accord de partage, les journaux de sortie de trois opérateurs
  d'électricité. Ils sont dans `~/partage-energie/`. Nos indicateurs — tout ce
  qu'on a appris depuis Vallon — sont dans `~/indicateurs/`.

  Si le chant est quelque part dans ces réseaux, je veux savoir où. Et je veux
  savoir pourquoi maintenant : six mois après les Pannes de Novembre, presque
  jour pour jour.

  Attention aux fausses alertes. Un indicateur faible qui « matche », ce n'est
  pas un adversaire.

  — Mara

debrief: |
  **Une correspondance est une piste ; plusieurs correspondances
  indépendantes font un cas.** Chez l'opérateur A, un seul point commun : un
  fournisseur DNS partagé par des milliers de clients. Faux positif. Chez REV,
  le Réseau Électrique du Val, une machine interne parlait toutes les cinq
  minutes au serveur de commande de Vallon. Même adresse, même rythme. Ce n'est
  plus une coïncidence.

  Et l'avis public de Corvane Grid Services annonçait une télémaintenance chez
  REV pour le **11 mai, de 2 h à 4 h**. Six mois jour pour jour après les
  Pannes.

  Il reste quatre jours.

scenario:
  clock: '2031-05-07T09:30:00Z'
  start: { host: echo-ws, user: operateur-7 }
  known: [echo-ws]
  networks:
    - { id: echo-lan, cidr: 10.7.0.0/24, label: réseau interne ECHO }
  hosts:
    - id: echo-ws
      hostname: echo-ws
      ip: 10.7.0.7
      os: EchoOS 4.2 (Linux 6.8)
      networks: [echo-lan]
      accounts:
        - { user: operateur-7 }
      files:
        /home/operateur-7/indicateurs/ioc-echo.txt: |
          INDICATEURS ECHO — consolidés au 06/05/2031
          type        valeur                      fiabilité   origine
          domaine     edge-sync.example           forte       Vallon (fs-01)
          ip          203.0.113.200               forte       Vallon (fs-01)
          fichier     /var/tmp/.cache/sysupd      forte       Vallon (fs-01)
          rythme      300 s                       moyenne     Vallon (fs-01)
          plage       203.0.113.64/29             forte       hameçonnage + webmail
          domaine     lanterne-presse.example     forte       hameçonnage
          dns         ns1.dns-relais.example      FAIBLE      fournisseur partagé
        /home/operateur-7/partage-energie/LISEZMOI.txt: |
          CERT sectoriel énergie → ECHO — accord de partage n°2031-14
          Diffusion : TLP:AMBER (ECHO et les opérateurs concernés uniquement).
          Fichiers : connexions sortantes, 05/05 et 06/05, trois opérateurs.
            op-a.csv   Opérateur A (anonymisé)
            op-b.csv   Opérateur B (anonymisé)
            rev.csv    Réseau Électrique du Val (REV) — accord nominatif
          Format : date;source_interne;destination;nom;octets
        /home/operateur-7/partage-energie/op-a.csv: |
          date;source_interne;destination;nom;octets
          2031-05-05T08:01:10Z;10.31.0.20;192.0.2.80;www.meteo-publique.example;20412
          2031-05-05T08:15:42Z;10.31.0.53;198.51.100.53;ns1.dns-relais.example;512
          2031-05-05T09:02:03Z;10.31.0.21;192.0.2.81;maj.editeur-scada.example;881023
          2031-05-06T08:14:09Z;10.31.0.53;198.51.100.53;ns1.dns-relais.example;498
        /home/operateur-7/partage-energie/op-b.csv: |
          date;source_interne;destination;nom;octets
          2031-05-05T07:58:00Z;10.32.0.11;192.0.2.80;www.meteo-publique.example;19870
          2031-05-05T10:20:31Z;10.32.0.40;203.0.113.10;www.ch-vallon.example;5120
          2031-05-06T07:59:12Z;10.32.0.11;192.0.2.80;www.meteo-publique.example;20033
        /home/operateur-7/partage-energie/rev.csv: |
          date;source_interne;destination;nom;octets
          2031-05-05T02:00:07Z;10.50.0.40;203.0.113.200;edge-sync.example;412
          2031-05-05T02:05:07Z;10.50.0.40;203.0.113.200;edge-sync.example;409
          2031-05-05T02:10:06Z;10.50.0.40;203.0.113.200;edge-sync.example;415
          2031-05-05T08:12:44Z;10.50.0.11;192.0.2.80;www.meteo-publique.example;20410
          2031-05-05T09:30:02Z;10.50.0.40;198.51.100.161;telemaint.corvane-grid.example;88120
          2031-05-06T02:00:06Z;10.50.0.40;203.0.113.200;edge-sync.example;411
