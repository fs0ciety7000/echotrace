          - 2031-05-18 · Opérateur Sud-Ouest · mise à jour supervision (sur site)

objectives:
  - id: ioc
    label: Relire les indicateurs de la cellule
    on: file.read
    where: { path: /home/operateur-7/indicateurs/ioc-echo.txt }
    hint: ~/indicateurs/. Note la colonne fiabilité.
    concepts: [forensique.ioc]

  - id: accord
    label: Lire les conditions de l'accord de partage
    requires: [ioc]
    on: file.read
    where: { path: /home/operateur-7/partage-energie/LISEZMOI.txt }
    hint: Avant d'exploiter des données confiées, on lit les conditions.

  - id: report-operateur
    label: 'Rapport : l''opérateur touché'
    requires: [accord]
    on: finding.confirmed
    where: { questionId: operateur }
    hint: 'Cherche chaque indicateur fort dans les trois fichiers. grep accepte plusieurs fichiers à la suite (pas de joker * ici : nomme-les).'
    concepts: [forensique.correlation]

  - id: report-machine
    label: 'Rapport : la machine qui chante'
    requires: [report-operateur]
    on: finding.confirmed
    where: { questionId: machine }

  - id: report-faux-positif
    label: 'Rapport : le faux positif'
    requires: [report-operateur]
    on: finding.confirmed
    where: { questionId: faux-positif }
    hint: Un autre opérateur correspond à un indicateur. Lequel, et quelle est sa fiabilité ?

  - id: avis
    label: Consulter l'avis public de Corvane Grid
    requires: [report-machine]
    on: file.read
    where: { path: /home/operateur-7/osint/avis-maintenance-grid.txt }
    concepts: [reconnaissance.osint]

  - id: report-date
    label: 'Rapport : la date à risque'
    requires: [avis]
    on: finding.confirmed
    where: { questionId: date }

  - id: decision
    label: Décider comment alerter
    requires: [report-date, report-faux-positif]
    on: choice.made
    where: { choiceId: alerte }
    hint: La décision t'attend dans le panneau.
    concepts: [ethique.divulgation]

questions:
  - id: operateur
    prompt: Quel opérateur présente des connexions vers l'infrastructure de Vallon ?
    accept: [REV, rev.csv, Réseau Électrique du Val, reseau electrique du val, rev-energie]
    explain: 'REV : des connexions vers 203.0.113.200 (edge-sync.example) toutes les cinq minutes.'
  - id: machine
    prompt: Quelle adresse interne de REV contacte le serveur de commande ?
    requires: [operateur]
    accept: [10.50.0.40]
    explain: Une seule machine interne, au rythme du chant — 300 secondes.
  - id: faux-positif
    prompt: Quel autre opérateur correspond à un indicateur, mais seulement à un indicateur faible ?
    requires: [operateur]
    accept: [op-a, opérateur a, operateur a, a]
    hint: Regarde la colonne fiabilité de nos indicateurs.
    explain: L'opérateur A interroge le fournisseur DNS partagé — comme des milliers d'autres. Faux positif.
  - id: date
    prompt: Quelle intervention à risque est programmée chez cet opérateur (date) ?
    requires: [machine]
    accept: ['2031-05-11', 11/05/2031, 11 mai 2031, 11 mai]
    explain: Une télémaintenance Corvane Grid, de 2 h à 4 h — six mois jour pour jour après les Pannes.

choices:
  - id: alerte
    from: Mara Okonkwo-Lind
    on: objective.completed
    where: { objectiveId: report-date }
    prompt: |
      Quatre jours. Il faut prévenir. La question, c'est **qui** et **comment**.

      Les données viennent du CERT sectoriel, sous TLP:AMBER : on peut les
      partager avec REV et l'autorité, pas avec le public. Théo propose une
      alerte publique « pour que tous les opérateurs vérifient ». Noor veut
      passer par l'ANCS, qui coordonnera. Toi ?
    options:
      - id: coordonner
        label: Prévenir REV et l'ANCS en même temps
        description: L'opérateur peut agir tout de suite ; l'autorité coordonne la suite.
        effects: { integrity: 10, initiative: 5 }
        consequence: |
          L'équipe sécurité de REV a rappelé dans l'heure, l'ANCS dans la
          journée. La télémaintenance du 11 est « reportée pour raisons
          techniques ». REV vous ouvre ses portes pour la nuit du 10.
      - id: ancs
        label: Passer uniquement par l'ANCS
        description: La voie officielle ; elle décidera de prévenir REV.
        effects: { integrity: 5, initiative: -10 }
        consequence: |
          L'ANCS a prévenu REV… deux jours plus tard. Il restait quarante-huit
          heures pour préparer la nuit du 10. Juste assez.
      - id: public
        label: Lancer une alerte publique avec Lanterne
        description: Tous les opérateurs vérifient — mais l'accord de partage est rompu.
        effects: { integrity: -10, initiative: 15 }
        consequence: |
          L'alerte de Lanterne a fait le tour du secteur. Plusieurs opérateurs
          ont vérifié leurs réseaux. Le CERT sectoriel a suspendu l'accord de
          partage, et Corvane a su exactement ce que vous saviez.

messages:
  - id: noor-faux-positif
    from: Dr Noor Haddad
    on: objective.completed
    where: { objectiveId: report-faux-positif }
    body: |
      Bien vu. Si on avait alerté l'opérateur A sur la base du DNS partagé, on
      aurait brûlé notre crédibilité pour rien. La fiabilité d'un indicateur
      compte autant que sa présence.

  - id: iris-onze
    from: inconnu
    subject: '◇'
    on: objective.completed
    where: { objectiveId: report-date }
    when: { silence/zero: seul }
    body: |
      tu as vu la date. moi aussi, il y a six mois, trop tard.
      la passerelle. regarde la passerelle.

      — I.

  - id: mara-onze
    from: Mara Okonkwo-Lind
    on: objective.completed
    where: { objectiveId: report-date }
    when: { silence/zero: mara }
    body: |
      Iris vient de nous écrire, à toutes les deux : « la passerelle ». Elle
      n'en dit pas plus. Je crois qu'elle a enfin décidé de nous faire confiance.
