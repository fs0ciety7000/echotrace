  start: { host: echo-ws, user: operateur-7 }
  known: [echo-ws, echo-intel]
  networks:
    - { id: echo-lan, cidr: 10.7.0.0/24, label: réseau interne ECHO }
    - { id: internet-a, cidr: 203.0.113.0/24, label: Internet (simulé) }
    - { id: internet-b, cidr: 198.51.100.0/24, label: Internet (simulé) }
  hosts:
    - id: echo-ws
      hostname: echo-ws
      ip: 10.7.0.7
      os: EchoOS 4.2 (Linux 6.8)
      networks: [echo-lan, internet-a, internet-b]
      accounts:
        - { user: operateur-7 }
      files:
        /home/operateur-7/dossiers/acces-intel.txt: |
          echo-intel — archives de veille de la cellule
          compte : veille   mot de passe : archives-lanterne
          Contenu : /srv/archives/ (certificats observés, notes d'enquête)
        /home/operateur-7/dossiers/ch-vallon/indicateurs.txt: |
          INDICATEURS — incident CH Vallon (fs-01)
          ----------------------------------------
          fichier     /var/tmp/.cache/sysupd
          relance     /etc/cron.d/sysupd
          serveur     edge-sync.example (203.0.113.200), port 8443
          rythme      300 s
          certificat  à relever (empreinte SHA-256)

    - id: echo-intel
