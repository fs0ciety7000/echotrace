    - id: c2-relay
      hostname: edge-sync.example
      ip: 203.0.113.200
      os: inconnu
      networks: [internet-a]
      icmp: false
      services:
        - port: 8443
          name: https-alt
          tls:
            subject: CN=edge-sync.example
            issuer: CN=edge-sync.example
            notBefore: '2030-10-28'
            notAfter: '2032-10-27'
            san: [edge-sync.example]
            sha256: '5B:A9:BC:8D:EB:E2:64:71:F5:91:CD:22:55:63:D2:1C:8B:65:BD:14:D6:DC:76:DB:8F:3D:AD:6E:AD:55:BC:BC'

    - id: corvane-sso
      hostname: sso-legacy.corvane.example
      ip: 198.51.100.140
      os: inconnu
      networks: [internet-b]
      services:
        - port: 443
          name: https
          tls:
            subject: CN=edge-sync.example
            issuer: CN=edge-sync.example
            notBefore: '2030-10-28'
            notAfter: '2032-10-27'
            san: [edge-sync.example]
            sha256: '5B:A9:BC:8D:EB:E2:64:71:F5:91:CD:22:55:63:D2:1C:8B:65:BD:14:D6:DC:76:DB:8F:3D:AD:6E:AD:55:BC:BC'

    - id: corvane-www
      hostname: www.corvane.example
      ip: 198.51.100.141
      os: inconnu
      networks: [internet-b]
      services:
        - port: 443
          name: https
          http:
            status: 200
            headers: { Server: corvane-edge }
            body: |
              <h1>Corvane Holdings — Résilience des infrastructures critiques</h1>
              <p>Partenaire de confiance de l'énergie, du transport et de la santé.</p>
          tls:
            subject: CN=www.corvane.example, O=Corvane Holdings AG
            issuer: CN=Autorité Publique de Test R3, O=Exemple Trust
            notBefore: '2031-01-04'
            notAfter: '2032-01-04'
            san: [www.corvane.example, corvane.example]
            sha256: '30:AD:D7:B5:35:BF:2F:FE:4A:0F:63:11:7D:0D:6D:30:E8:D2:78:83:DD:B9:29:19:C0:02:32:4E:B4:C9:C0:AC'

  domains:
    - name: edge-sync.example
      registrar: Nordhavn Domains ApS
      registrant: REDACTED FOR PRIVACY
      created: '2030-10-27'
      expires: '2031-10-27'
      nameservers: [ns1.dns-relais.example, ns2.dns-relais.example]
      abuse: abuse@nordhavn-domains.example
      records:
        - { name: '@', type: A, value: 203.0.113.200 }
    - name: corvane.example
      registrar: Registre Hexagone SAS
      registrant: Corvane Holdings AG
      created: '2016-03-09'
      expires: '2033-03-09'
      nameservers: [ns1.dns-relais.example, ns2.dns-relais.example]
      abuse: abuse@registre-hexagone.example
      records:
        - { name: '@', type: A, value: 198.51.100.141 }
        - { name: www, type: A, value: 198.51.100.141 }
        - { name: sso-legacy, type: A, value: 198.51.100.140 }
        - { name: '@', type: MX, value: 10 mx.corvane.example }

objectives:
  - id: cert-c2
    label: Relever l'empreinte du certificat du serveur distant
    on: tls.inspected
    where: { hostId: c2-relay }
    hint: Les indicateurs sont dans ~/dossiers/ch-vallon/indicateurs.txt. Le service écoute sur 8443, pas 443. `man cert`.
    concepts: [reseau.certificat-tls]

  - id: archives
    label: Consulter les archives de veille
    requires: [cert-c2]
    on: session.opened
    where: { hostId: echo-intel }
    hint: Les accès sont dans ~/dossiers/acces-intel.txt.

  - id: report-empreinte
    label: 'Rapport : où ce certificat a déjà été vu'
    requires: [archives]
    on: finding.confirmed
    where: { questionId: empreinte }
    hint: Cherche un fragment de l'empreinte dans /srv/archives/certificats.csv avec grep.
    concepts: [reconnaissance.pivot, forensique.ioc]

  - id: whois-both
    label: Comparer les fiches d'enregistrement des deux domaines
    requires: [report-empreinte]
    on: whois.queried
    where: { domain: corvane.example, found: true }
    hint: Compare le whois de edge-sync.example avec celui du domaine de l'archive.
    concepts: [reconnaissance.whois]

  - id: report-dns
    label: 'Rapport : l''infrastructure partagée'
    requires: [whois-both]
    on: finding.confirmed
    where: { questionId: dns }
    hint: Deux domaines, deux fiches. Une ligne est identique.

  - id: report-confiance
    label: 'Rapport : niveau de confiance de l''attribution'
    requires: [report-dns]
    on: finding.confirmed
    where: { questionId: confiance }
    hint: Relis la fiche Attribution. Qu'est-ce que ces indices prouvent — et qu'est-ce qu'ils ne prouvent pas ?
    concepts: [ethique.attribution]

  - id: decision
    label: Décider à qui transmettre le dossier
    requires: [report-confiance]
    on: choice.made
    where: { choiceId: dossier }
    hint: La décision t'attend dans le panneau de décision.

  - id: still-live
    label: Vérifier si le certificat est encore en service chez Corvane
    optional: true
    requires: [report-empreinte]
    on: tls.inspected
    where: { hostId: corvane-sso }
    hint: Regarder le certificat qu'un serveur public présente, c'est ce que fait n'importe quel navigateur. Pas besoin de scan.

questions:
  - id: empreinte
    prompt: Sur quel serveur ce certificat a-t-il déjà été observé ?
    accept: [sso-legacy.corvane.example, 198.51.100.140, sso-legacy]
    hint: L'empreinte est unique. Un fragment suffit pour la retrouver dans l'archive.
    explain: Le même certificat auto-signé, relevé en novembre 2030 sur un serveur de Corvane. Un écho.
  - id: dns
    prompt: Quel fournisseur de serveurs de noms les deux domaines partagent-ils ?
    requires: [empreinte]
    accept: [dns-relais.example, ns1.dns-relais.example, ns2.dns-relais.example]
    hint: Compare les lignes « Serveurs de noms » des deux whois.
    explain: Un second écho, plus faible — un fournisseur DNS peut avoir des milliers de clients.
  - id: organisation
    prompt: À quelle organisation ces indices renvoient-ils ?
    requires: [empreinte]
    accept: [Corvane, Corvane Holdings, Corvane Holdings AG]
    hint: Qui est titulaire de corvane.example ?
    explain: Les indices pointent vers Corvane. Pointer n'est pas prouver.
  - id: confiance
    prompt: Quel niveau de confiance donner à l'attribution (faible, modéré ou élevé) ?
    requires: [dns]
    accept: [modéré, modere, modérée, moderee, moyen, moyenne]
    hint: Trois indices convergent, mais chacun a une explication alternative. Ni rien, ni certitude.
    explain: "Modéré : des indices convergents, aucun décisif. Un serveur compromis, un fournisseur partagé, un faux indice restent possibles."

choices:
  - id: dossier
    from: Mara Okonkwo-Lind
    on: objective.completed
    where: { objectiveId: report-confiance }
    prompt: |
      Le dossier est prêt. Trois personnes m'appellent en même temps.

      L'**ANCS** veut tout, maintenant, « par la voie officielle ». **Théo**
      dit que Lanterne peut publier demain et que c'est le seul moyen que ça
      ne soit pas enterré. **Sable** dit qu'on n'a qu'un fil et qu'il faut
      tirer dessus avant de montrer notre jeu.

      Je veux ta recommandation.
    options:
      - id: ancs
        label: Transmettre à l'ANCS
        description: La voie légale. Lente, peut-être enterrée — mais la preuve reste recevable.
        effects: { integrity: 15, initiative: -5 }
        consequence: |
          Le dossier est parti à l'ANCS avec le niveau de confiance écrit en
          gras. Accusé de réception poli. Rien depuis. Mais si un jour il y a
          un procès, rien de ce que tu as fait ne pourra être retourné contre lui.
      - id: lanterne
        label: Donner le dossier à Lanterne
        description: Publier, alerter les autres hôpitaux — au risque d'accuser trop tôt.
        effects: { integrity: -5, initiative: 15 }
        consequence: |
          Lanterne a publié « Un écho de Corvane dans l'hôpital de Vallon ».
          Trois autres établissements ont trouvé le même chant chez eux. Corvane
          a annoncé une plainte en diffamation, et a changé tous ses certificats
          dans l'heure.
      - id: creuser
        label: Garder le dossier et continuer à creuser
        description: Ne rien montrer tant qu'on n'a pas plus solide.
        effects: { integrity: 0, initiative: 5 }
        consequence: |
          Le dossier est resté dans le coffre d'ECHO. Personne n'a été alerté —
          ni l'ANCS, ni les autres hôpitaux. Vous avez gagné du temps. Eux aussi.

messages:
  - id: noor-start-couper
    from: Dr Noor Haddad
    on: mission.started
    when: { confinement/chant: couper }
    body: |
      Le CH a rouvert à l'heure, propre. On n'a plus de chant à écouter, mais
      on a ses indicateurs. C'est souvent suffisant.

  - id: noor-start-encadrer
    from: Dr Noor Haddad
    on: mission.started
    when: { confinement/chant: encadrer }
    body: |
      Les 48 heures d'observation encadrée sont finies. Deux consignes reçues,
      rien d'exploitable — mais la DSI nous fait confiance. Ça vaut de l'or.

  - id: sable-start-observer
    from: Ilya « Sable » Varga
    on: mission.started
    when: { confinement/chant: observer }
    body: |
      48 heures d'écoute. Le serveur distant a changé deux fois de consigne,
      et 2 Go de documents sont partis. On sait au moins ce qu'ils cherchent.
      Mara ne dort plus. Moi, ça va.

  - id: theo-corvane
    from: Théo Marchetti
    on: objective.completed
    where: { objectiveId: report-empreinte }
    body: |
      Corvane ?! Je l'avais noté en novembre, ce portail bizarre. Je savais
      qu'il y avait quelque chose. On publie quand ?

  - id: noor-prudence
    from: Dr Noor Haddad
    on: objective.completed
    where: { objectiveId: report-dns }
    body: |
      Attention à l'effet tunnel. Ce que tu as, ce sont des échos. Avant
      d'écrire « Corvane », demande-toi ce qui expliquerait les mêmes indices
      si Corvane était innocente.

  - id: inconnu-fin
    from: inconnu
    subject: '◇'
    on: choice.made
    where: { choiceId: dossier }
    body: |
      tu as trouvé le premier écho.

      il y en a d'autres. cherche novembre.

      — 0
