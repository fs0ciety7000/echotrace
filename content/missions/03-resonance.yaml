# Acte I — Mission 03 « Résonance »
# Recoupement d'indicateurs (pivot) : empreinte de certificat, archives, whois, DNS.
# Attribution prudente et choix de destinataire du dossier.
# Question : peut-on dire qui est derrière une attaque ?

id: resonance
title: Résonance
act: acte-1
order: 3
from: Mara Okonkwo-Lind
summary: Remonter du serveur distant à son opérateur — sans conclure trop vite.
question: Peut-on dire qui est derrière une attaque ?
concepts:
  - reseau.certificat-tls
  - reconnaissance.pivot
  - reconnaissance.whois
  - reseau.dns
  - forensique.ioc
  - ethique.attribution

briefing: |
  Le chant de fs-01 parlait à `edge-sync.example`, `203.0.113.200`. Une
  adresse, un nom : ça se loue, ça se jette. Ce n'est pas ça qui nous dira
  qui est derrière.

  Ce qui ne se jette pas si facilement, ce sont les **habitudes**. Le même
  certificat réutilisé, les mêmes serveurs de noms, le même registrar…
  Chaque détail est un **écho** possible avec quelque chose qu'on a déjà vu.

  Nos archives de veille sont sur `echo-intel`. Les accès sont dans
  `~/dossiers/acces-intel.txt`. Tu ne touches **qu'à ce qui est public** :
  regarder le certificat qu'un serveur présente à n'importe quel navigateur,
  oui ; scanner l'infrastructure de quelqu'un, non.

  Et souviens-toi : on cherche des preuves, pas un coupable.

  — Mara

debrief: |
  **Peut-on dire qui est derrière une attaque ?** Rarement avec certitude.
  Tu as relié trois échos indépendants :

  - le certificat du serveur de commande, **déjà vu en novembre 2030** sur
    un serveur de Corvane ;
  - les **mêmes serveurs de noms** pour `edge-sync.example` et `corvane.example` ;
  - un serveur épargné qui contenait justement un projet mené **avec Corvane**.

  C'est beaucoup. Ce n'est pas une preuve. Un serveur de Corvane a pu être
  compromis et réutilisé ; un fournisseur DNS est partagé par des milliers de
  clients ; un indice trop beau peut être posé là pour être trouvé. D'où un
  niveau de confiance **modéré** — et la discipline de l'écrire noir sur blanc.

  Fin de l'Acte I. Ce que nous avons entendu n'était pas un bruit isolé :
  c'était une **résonance**.

