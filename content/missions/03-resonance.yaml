          Astuce : une empreinte est longue — cherche un fragment.
        /srv/archives/certificats.csv: |
          date;nom;adresse;empreinte_sha256;source
          2029-02-11;webmail.mairie-orsay.example;198.51.100.21;0E:44:91:7A:3C:B2:18:F5:62:D9:0A:47:CE:13:88:B6:21:5F:A0:7D:94:3B:C6:12:E8:5A:07:F1:39:DC:64:2B;dossier Orsay
          2029-08-30;vpn.cooperative-lin.example;198.51.100.33;A7:12:5E:C0:93:4D:B8:27:6F:E1:05:9A:D4:3C:71:28:BF:60:1E:A9:57:C2:84:0D:36:F7:B1:4A:E9:52:08:CD;dossier Coop Lin
          2030-01-19;portail.agglo-sud.example;198.51.100.47;C5:76:04:2D:08:44:7A:C1:00:77:15:15:9C:9D:99:71:89:67:6C:F1:F7:29:BA:1C:77:47:61:D6:6A:39:7B:26;dossier Agglo Sud
          2030-06-02;mail.transports-ouest.example;198.51.100.58;3D:E8:20:B4:69:1F:C7:5A:92:0E:F3:48:A6:D1:7C:35:08:BB:62:E4:1D:97:4F:C0:2A:85:F9:13:6E:B7:50:D2;dossier Transports Ouest
          2030-11-08;sso-legacy.corvane.example;198.51.100.140;5B:A9:BC:8D:EB:E2:64:71:F5:91:CD:22:55:63:D2:1C:8B:65:BD:14:D6:DC:76:DB:8F:3D:AD:6E:AD:55:BC:BC;relevé Lanterne (Théo)
