# Le Banc — module 3 « Lire un journal web »
id: banc-journaux
title: Lire un journal web
act: banc
order: 3
from: Dr Noor Haddad
summary: Compter, trier et classer les lignes d'un journal pour comprendre un trafic.
question: Comment distinguer un visiteur ordinaire d'un comportement inhabituel dans un journal ?
concepts: [forensique.logs, forensique.pipelines, reseau.http]

briefing: |
  Exercice du Banc. Le site vitrine d'une association (fictive) s'inquiète :
  « beaucoup d'erreurs ce matin, sommes-nous attaqués ? ». Le journal d'accès
  est sur `banc-web`, compte `exercice`, mot de passe `journal-banc`.

  Ne lis pas les lignes une à une : fais parler le journal avec des
  **pipelines** (`cut`, `sort`, `uniq -c`, `grep`, `wc -l`).

debrief: |
  Un seul visiteur concentre toutes les erreurs : un **robot vérificateur de
  liens** qui parcourt les anciennes adresses du site. Ce n'est pas une
  attaque — c'est même un service rendu : il signale des liens cassés. Mais
  pour le dire, il fallait **compter** (qui ? combien ?), **filtrer** (quelles
  erreurs ?) et **lire** l'identité déclarée du visiteur.

  Réflexe à garder : un pic d'erreurs se qualifie avant de se dramatiser.

scenario:
  clock: '2031-03-20T14:00:00Z'
  start: { host: echo-ws, user: operateur-7 }
  known: [echo-ws, banc-web]
  networks:
    - { id: banc, cidr: 10.7.1.0/24 }
  hosts:
    - { id: echo-ws, hostname: echo-ws, ip: 10.7.1.2, networks: [banc], accounts: [{ user: operateur-7 }] }
    - id: banc-web
      hostname: banc-web
      ip: 10.7.1.10
      networks: [banc]
      services:
        - { port: 22, name: ssh, product: OpenSSH, version: 9.2p1 }
        - { port: 80, name: http, product: nginx, version: 1.24.0 }
      accounts:
