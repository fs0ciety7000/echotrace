objectives:
  - { id: login, label: Te connecter à banc-web, on: session.opened, where: { hostId: banc-web } }
  - { id: total, label: 'Rapport : nombre de requêtes', requires: [login], on: finding.confirmed, where: { questionId: total }, concepts: [forensique.pipelines], hint: '`wc -l` compte les lignes.' }
  - { id: erreurs, label: 'Rapport : nombre d''erreurs 404', requires: [total], on: finding.confirmed, where: { questionId: erreurs }, hint: 'Filtre les lignes contenant " 404 " puis compte-les.' }
  - { id: actif, label: 'Rapport : le visiteur le plus actif', requires: [total], on: finding.confirmed, where: { questionId: actif }, hint: 'cut -d " " -f 1 … | sort | uniq -c | sort -rn' }
  - { id: qui, label: 'Rapport : qui est ce visiteur ?', requires: [actif, erreurs], on: finding.confirmed, where: { questionId: qui }, concepts: [reseau.http], hint: 'Regarde la fin de ses lignes : le champ « navigateur » (User-Agent).' }
  - { id: verdict, label: 'Rapport : attaque ou pas ?', requires: [qui], on: finding.confirmed, where: { questionId: verdict } }

questions:
  - { id: total, prompt: Combien de requêtes contient le journal ?, accept: ['59'] }
  - { id: erreurs, prompt: Combien de réponses 404 (page introuvable) ?, accept: ['14'], hint: Attention à ne compter que le statut, pas un 404 qui apparaîtrait ailleurs. }
  - { id: actif, prompt: Quelle adresse a fait le plus de requêtes ?, accept: [203.0.113.77] }
  - { id: qui, prompt: Quel outil se déclare derrière cette adresse ?, accept: [VerifLiens, VerifLiens/2.1, robot VerifLiens], explain: Un vérificateur de liens, qui annonce même une page d'information sur lui. }
  - { id: verdict, prompt: S'agit-il d'une attaque (oui ou non) ?, accept: [non], hint: Que demande-t-il ? D'anciennes pages publiques. Que fait-il d'autre ?, explain: Non — un robot qui teste d'anciens liens. Le vrai sujet, c'est le site qui a cassé ses liens. }
